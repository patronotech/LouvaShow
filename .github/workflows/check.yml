name: Verificar código público

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Código e testes · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python para auditoria
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Auditar arquivos públicos rastreados
        run: python scripts/audit-public-source.py
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Dependências nativas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Rust estável
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Dependências frontend fixadas
        run: npm ci
      - name: Build frontend e TypeScript
        run: npm run build
      - name: Testes frontend
        run: npm test
      - name: Formatação Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Verificar Rust sem acervo opcional
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features
      - name: Testes Rust sem acervo opcional
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
