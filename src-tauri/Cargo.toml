[package]
name = "louvashow"
version = "0.6.1"
edition = "2021"

[lib]
name = "louvashow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
roxmltree = "0.21.2"
sha2 = "0.10"
tauri-plugin-dialog = "2"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

tempfile = "3"
tauri-plugin-opener = "=2.7.2"
axum = "=0.8.9"
if-addrs = "=0.15.0"
keyring = "=4.2.0"
unicode-segmentation = "1.12"
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "multipart"] }
scraper = "=0.29.0"

[features]
default = []
bundled-hymns = []

[profile.release]
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
